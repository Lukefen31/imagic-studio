[project]
name = "imagic-studio-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents and CLIs drive imagic studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mcp>=1.2.0",
    "pillow>=10.0",
]

[project.scripts]
imagic-studio-mcp = "imagic_studio_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagic_studio_mcp"]
