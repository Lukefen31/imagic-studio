# imagic studio macOS build.
#
# Sibling of build-windows.yml, following the same principle: mirror upstream
# Krita's GitLab CI contract (build-tools/ci-scripts/macos.yml) on GitHub
# Actions. Download KDE's prebuilt macOS dependency packages from
# invent.kde.org's package registry (anonymous, public), build Krita itself,
# then produce the .app and .dmg with upstream's own packaging scripts.
#
# What differs from upstream: KDE signs and notarizes through their internal
# ci-notary-service, which we have no access to. We do it ourselves with the
# imagic Developer ID, in the "Sign and notarize" steps below, and only when
# the certificate secret is present.
#
# Cold run on the free macOS runner is expected to be long (upstream's own
# macOS job is the slowest of the three); a warm ccache should cut the compile
# substantially, exactly as it does on Windows.

name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "imagic-studio release tag to upload the DMG to (leave empty for artifacts only)"
        required: false
        default: ""

concurrency:
  group: build-macos-${{ github.ref }}
  # Deliberately NOT cancel-in-progress. A cold run here is hours of
  # compiling; a second dispatch killed one at 1907/3604 objects with
  # nothing wrong with it. Queue behind, never discard.
  cancel-in-progress: false

env:
  # Pinned to the same KDE helper revisions the Windows build uses, so the two
  # platforms cannot drift onto different dependency sets.
  DEPS_MGMT_SHA: 44a226bacca177515162b45b233f10c95da4d20b
  CI_UTILITIES_SHA: 9285a277a971fcea3e0332bb5b7906ecfe6116bd

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Clone KDE CI helper repos (pinned)
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git
          git -C krita-deps-management checkout $DEPS_MGMT_SHA
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities
          git -C krita-deps-management/ci-utilities checkout $CI_UTILITIES_SHA

      - name: Install ccache
        run: brew install ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-macos-qt5-${{ github.sha }}
          restore-keys: |
            ccache-macos-qt5-

      - name: Python venv + requirements
        run: |
          python3 -m venv venv --upgrade-deps
          . venv/bin/activate
          pip install -r krita-deps-management/requirements.txt

      - name: Download the KDE macOS toolchain
        # Upstream's macos.yml does this before anything else: the toolchain
        # tarball carries the compiler and helper binaries the dep packages
        # were built against, and _krita-tools/activate puts them on PATH.
        run: |
          . venv/bin/activate
          python3 -u krita-deps-management/tools/download-macos-tools.py

      - name: Build Krita (prebuilt deps + source build)
        env:
          KDECI_BUILD_TYPE: Release
          KDECI_CC_CACHE: ${{ github.workspace }}/.ccache
          KDECI_CACHE_PATH: ${{ github.workspace }}/.kde-dep-cache
          KDECI_GITLAB_SERVER: https://invent.kde.org/
          KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-macos
          KDECI_REPO_METADATA_PATH: ${{ github.workspace }}/krita-deps-management/repo-metadata
          KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: "False"
          # Release settings, matching upstream's macos-release-qt5 job and
          # our own Windows build: asserts hidden, tests off.
          KDECI_EXTRA_CMAKE_ARGS: "-DHIDE_SAFE_ASSERTS=ON -DBUILD_TESTING=OFF -DBRANDING=default"
          KDECI_ONLY_BUILD: "True"
          KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: "True"
          KRITACI_SKIP_BUILD_3RDPARTY_PLUGINS: "True"
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/krita-deps-management/tools/macos-toolchain-krita.cmake
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          QMAKE_MACOSX_DEPLOYMENT_TARGET: "10.15"
          PYTHONUTF8: "1"
          CI_PROJECT_NAME: krita
          CI_PROJECT_DIR: ${{ github.workspace }}
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
        run: |
          . venv/bin/activate
          # Upstream unsets this deliberately so the venv does not shadow the
          # toolchain binaries that _krita-tools/activate puts on PATH.
          unset VIRTUAL_ENV
          source _krita-tools/activate
          git config --global --add safe.directory "$CI_PROJECT_DIR"
          python3 -u krita-deps-management/tools/replace-branch-in-seed-file.py \
            krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d master
          python3 -u krita-deps-management/tools/generate-deps-file.py \
            -s branch-corrected-deps.yml -o .kde-ci.yml
          python3 -u krita-deps-management/ci-utilities/run-ci-build.py \
            --project "$CI_PROJECT_NAME" --branch "$CI_COMMIT_REF_NAME" \
            --platform MacOS/Qt5/Shared --skip-publishing 2>&1 | tee build-krita.log

      - name: Build the .app bundle
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          . venv/bin/activate
          unset VIRTUAL_ENV
          source _krita-tools/activate
          python3 -u packaging/macos/macos-deploy.py \
            --install-dir ./_install --output-dir "$CI_PROJECT_DIR/_dmg" \
            --krita-source ./ 2>&1 | tee build-app.log

      - name: Name the bundle after the product
        # CFBundleName and the app icon were rebranded back in August, so
        # the Dock and menu bar already say imagic studio. Two things
        # were not: the bundle's own filename, which is the label Finder
        # and Applications show, and CFBundleDisplayName, which is the
        # key that overrides it. Both must happen BEFORE signing, since
        # renaming or re-plisting a signed bundle invalidates its
        # signature.
        run: |
          APP="$(ls -d _dmg/*.app | head -1)"
          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleDisplayName string 'imagic studio'" \
            "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c \
              "Set :CFBundleDisplayName 'imagic studio'" \
              "$APP/Contents/Info.plist"
          if [ "$(basename "$APP")" != "imagic studio.app" ]; then
            mv "$APP" "_dmg/imagic studio.app"
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" \
            "_dmg/imagic studio.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" \
            "_dmg/imagic studio.app/Contents/Info.plist"

      - name: Import Developer ID certificate
        # Signing is skipped rather than failed when the secret is absent, so
        # the first runs can prove the build works before the certificate is
        # copied into this repo. An unsigned bundle is clearly named as such
        # at upload time so it cannot be mistaken for a shippable one.
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "No signing certificate in this repo; producing an unsigned build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check for notarization credentials
        # Signing and notarizing are separate gates. The certificate alone
        # produces a correctly signed bundle; notarization additionally
        # needs an Apple ID and an app-specific password. Missing the
        # second must not throw away a build that satisfied the first.
        id: notary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Apple ID / app password; signing only, not notarizing."
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the .app bundle
        if: steps.cert.outputs.signed == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          APP="$(ls -d _dmg/*.app | head -1)"
          # Read the executable name out of the bundle rather than
          # assuming it: the app is still krita.app today and will not
          # always be, and a rebrand must not silently leave the main
          # binary unsigned.
          EXE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
            "$APP/Contents/Info.plist")"
          MAIN="$APP/Contents/MacOS/$EXE"
          test -f "$MAIN"
          chmod -R u+rw "$APP"
          xattr -cr "$APP"

          # Notarization requires a Developer ID signature, the hardened
          # runtime and a secure timestamp on EVERY Mach-O in the bundle,
          # and one unsigned Mach-O fails the whole submission, so find
          # them by content rather than by extension - this bundle
          # carries a Python framework and plugin binaries with no
          # suffix at all.
          #
          # file(1) prints one line PER ARCHITECTURE for a fat binary, on
          # top of a summary line, and --mime-type does not change that -
          # it only changes what follows the colon. So stripping the mime
          # type off the end still leaves the literal, non-existent path
          # "<path> (for architecture x86_64)", which is what codesign
          # rejected. Measured on a real 5,076-file bundle: 500 lines out,
          # 178 of them paths that do not exist. Krita ships universal
          # dependencies, so most of this bundle is fat.
          #
          # Strip the architecture suffix as well, then collapse the
          # duplicate lines each fat binary produces, keeping find's order.
          # Removing only the trailing mime type - never cutting at the
          # first colon - is what keeps paths containing colons or spaces
          # intact.
          SIGN_FLAGS=(--force --timestamp --options runtime --sign "$SIGN_IDENTITY")
          MACHOS="$RUNNER_TEMP/machos.txt"
          find "$APP" -type f -exec file --mime-type {} + \
            | sed -n 's/:[[:space:]]*application\/x-mach-binary$//p' \
            | sed 's/ (for architecture [^)]*)$//' \
            | awk '!seen[$0]++' > "$MACHOS"

          # This list has been wrong twice now, and each time the build
          # spent two hours compiling Krita before finding out. Check it
          # before a single codesign runs. Reading from a file rather than
          # a pipe keeps the loop out of a subshell so this exit works.
          while IFS= read -r macho; do
            test -e "$macho" || {
              echo "::error::not a real path, refusing to sign: $macho" >&2
              exit 1
            }
          done < "$MACHOS"
          echo "signing $(wc -l < "$MACHOS" | tr -d ' ') Mach-O binaries"

          while IFS= read -r macho; do
            [ "$macho" = "$MAIN" ] && continue
            codesign "${SIGN_FLAGS[@]}" "$macho"
          done < "$MACHOS"
          codesign "${SIGN_FLAGS[@]}" \
            --entitlements packaging/macos/entitlements.plist "$MAIN"
          codesign "${SIGN_FLAGS[@]}" \
            --entitlements packaging/macos/entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize the .app bundle
        if: steps.cert.outputs.signed == 'true' && steps.notary.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="$(ls -d _dmg/*.app | head -1)"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"

      - name: Build the .dmg
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
        run: |
          . venv/bin/activate
          unset VIRTUAL_ENV
          source _krita-tools/activate
          # hdiutil's arguments are assembled with a bare .split() in
          # macos-apptodmg.py, so the dmg name (which is also the volume
          # name) has to be free of spaces. The .app inside it is not.
          # checkout@v4 clones shallow and without tags, so describe would
          # otherwise name the DMG after a commit sha.
          git fetch --tags --force --quiet || true
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          [ -n "$VERSION" ] || VERSION="${GITHUB_SHA:0:8}"
          python3 -u packaging/macos/macos-apptodmg.py \
            "$CI_PROJECT_DIR"/_dmg/*.app \
            -n "imagic-studio-$VERSION" \
            --media-path ./packaging/macos/ 2>&1 | tee build-dmg.log

      - name: Sign the .dmg
        if: steps.cert.outputs.signed == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          DMG="$(ls _packaging/*.dmg | head -1)"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"

      - name: Notarize and staple the .dmg
        if: steps.cert.outputs.signed == 'true' && steps.notary.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="$(ls _packaging/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          # The check a real user's Mac performs on first open.
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: Name the artifact for what it is
        id: naming
        run: |
          if [ "${{ steps.notary.outputs.notarize }}" = "true" ]; then
            echo "name=imagic-studio-macos-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.cert.outputs.signed }}" = "true" ]; then
            echo "name=imagic-studio-macos-SIGNED-NOT-NOTARIZED-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=imagic-studio-macos-UNSIGNED-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload packages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: |
            _packaging/*.dmg
          if-no-files-found: warn

      - name: Upload to the release
        # Refuses to publish anything but a notarized build. Gatekeeper
        # blocks an unsigned bundle outright on Apple Silicon, and warns
        # on a signed-but-unnotarized one, so shipping either would be
        # worse than shipping nothing.
        if: ${{ inputs.release_tag != '' && steps.notary.outputs.notarize == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" _packaging/*.dmg \
            --repo Lukefen31/imagic-studio --clobber

      - name: Save ccache
        # cache/save rather than the round-trip action, with
        # always(): the object files a cancelled run produced are
        # exactly what the next run wants, and the default action
        # skips its post step when a job does not finish.
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-macos-qt5-${{ github.sha }}

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos-${{ github.run_number }}
          path: |
            build-krita.log
            build-app.log
            build-dmg.log
            _build/CMakeCache.txt
          if-no-files-found: warn
